  <style>
    /* ============================================================
       AGENT HOMEPAGE — chat rail + artifact-style side panel
       A scripted portfolio concierge. Internal links open in a
       right-side panel (iframe) instead of navigating away.
    ============================================================ */

    html, body { height: 100%; }

    /* ── App shell: rail | (chat pane | side panel) ── */
    .app { display: flex; height: 100dvh; overflow: hidden; background: var(--gutter); }

    /* ── Left rail (sidebar) — floating rounded panel (Claude-desktop style) ── */
    .rail {
      flex: 0 0 264px; width: 264px;
      display: flex; flex-direction: column;
      background: var(--bg); border: 1px solid var(--border);
      padding: 14px 12px;
      margin: 12px; border-radius: 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03), 0 6px 20px rgba(0, 0, 0, 0.06);
    }
    .rail-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 10px; }
    .rail-brand { display: flex; align-items: center; gap: 13px; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); text-decoration: none; }
    .rail-brand-mark { flex: 0 0 auto; height: 18px; width: auto; display: block; }
    .rail .rail-x { display: none; }
    /* desktop collapse toggle in the rail header; floating re-open button
       (compound selectors so they beat the base .icon-btn display rule) */
    .icon-btn.rail-collapse { display: none; }
    .icon-btn.rail-show {
      display: none; position: absolute; top: 16px; left: 16px; z-index: 60;
      background: var(--bg); border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 6px 18px rgba(0,0,0,0.06);
    }
    @media (min-width: 900px) {
      .icon-btn.rail-collapse { display: flex; }
      .app.rail-collapsed .rail { display: none; }
      .app.rail-collapsed .icon-btn.rail-show { display: flex; }
    }
    /* New chat — plain text + icon row (no button box) */
    .rail-newchat {
      display: flex; align-items: center; gap: 10px; width: 100%;
      font-family: inherit; font-size: 14px; font-weight: 550; color: var(--ink);
      background: none; border: none; border-radius: 8px;
      padding: 9px 8px; cursor: pointer; margin-bottom: 12px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .rail-newchat:hover { background: var(--hover-soft); }
    .rail-newchat svg { color: var(--accent); }
    .rail-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); padding: 0 8px; margin-bottom: 6px; }
    .rail-nav { display: flex; flex-direction: column; gap: 2px; }
    .rail-item {
      display: flex; align-items: center; gap: 11px;
      font-size: 14px; font-weight: 500; color: var(--ink-2); text-decoration: none;
      padding: 9px 10px; border-radius: 8px; cursor: pointer;
      transition: background 0.14s ease, color 0.14s ease;
    }
    .rail-item:hover { background: var(--hover-soft); color: var(--ink); }
    .rail-ic { width: 18px; height: 18px; flex-shrink: 0; color: var(--ink-3); }
    .rail-item:hover .rail-ic { color: var(--accent); }
    .rail-recent { margin-top: 20px; min-height: 0; overflow-y: auto; }
    .rail-recent[hidden] { display: none; }
    #rail-recent-list { display: flex; flex-direction: column; gap: 1px; }
    .rail-recent-item {
      display: block; width: 100%; text-align: left;
      font-family: inherit; font-size: 13.5px; font-weight: 450; color: var(--ink-2);
      background: none; border: none; cursor: pointer;
      padding: 8px 10px; border-radius: 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      transition: background 0.14s ease, color 0.14s ease;
    }
    .rail-recent-item:hover { background: var(--hover-soft); color: var(--ink); }
    .rail-foot { margin-top: auto; padding: 14px 8px 4px; display: flex; flex-direction: column; gap: 7px; border-top: 1px solid var(--border); }
    .rail-foot-link { font-size: 12.5px; color: var(--ink-3); text-decoration: none; transition: color 0.14s ease; }
    .rail-foot-link:hover { color: var(--ink); }
    .rail-theme { display: flex; align-items: center; gap: 9px; background: none; border: none; padding: 7px 0; margin-bottom: 4px; font: inherit; font-size: 12.5px; color: var(--ink-3); cursor: pointer; transition: color 0.14s ease; }
    .rail-theme:hover { color: var(--ink); }
    .rail-theme svg { width: 15px; height: 15px; flex: 0 0 auto; }

    .rail-scrim { display: none; }

    /* generic icon button (topbar / rail close) */
    .icon-btn {
      width: 38px; height: 38px; border-radius: 9px; border: none; background: none;
      color: var(--ink-2); cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.14s ease, color 0.14s ease;
    }
    .icon-btn:hover { background: var(--hover-soft); color: var(--ink); }

    /* mobile top bar (hidden on desktop) */
    .chat-topbar { display: none; }

    .agent-wrap {
      flex: 1; min-width: 0;
      display: flex;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /* ── Mobile: rail becomes a slide-out drawer ── */
    @media (max-width: 900px) {
      .rail {
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 210;
        margin: 0; border-radius: 0; border: none; border-right: 1px solid var(--border);
        transform: translateX(-100%); transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
        box-shadow: 0 0 60px rgba(0,0,0,0.18);
      }
      .app.rail-open .rail { transform: none; }
      .rail .rail-x { display: flex; }
      .app.rail-open .rail-scrim { display: block; position: fixed; inset: 0; z-index: 205; background: rgba(0,0,0,0.34); }
      .chat-topbar {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        flex-shrink: 0; padding: 8px 10px; border-bottom: 1px solid var(--border);
        background: var(--nav-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      }
      .chat-topbar-title { font-size: 14px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
    }
    @media (min-width: 900px) {
      .chat-pane { min-width: 400px; }
      .panel {
        transition: flex-basis 0.42s cubic-bezier(0.4, 0, 0.2, 1),
                    margin 0.42s cubic-bezier(0.4, 0, 0.2, 1),
                    border-color 0.3s ease, box-shadow 0.42s ease;
      }
      .agent-wrap.panel-open .panel {
        flex-basis: 54%;
        margin: 14px 16px 16px 8px;
        border-color: var(--border);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.12);
      }
    }

    /* ── Chat pane ── */
    .chat-pane {
      position: relative;
      flex: 1 1 0%;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    /* Empty state: greeting + composer centered together; composer un-docks */
    .chat-pane.is-empty { justify-content: center; }
    .chat-pane.is-empty .chat-scroll { flex: 0 1 auto; overflow: hidden; }
    .chat-pane.is-empty .composer-bar {
      position: static; border-top: none;
      background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none;
    }
    .chat-pane:not(.is-empty) .empty-state { display: none; }
    .empty-state { max-width: 640px; margin: 0 auto; text-align: center; }
    .empty-state .agent-intro h1 { margin-inline: auto; }
    .empty-state .home-cards { text-align: left; }
    .chat-scroll { flex: 1; overflow-y: auto; }
    .chat-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: clamp(36px, 6vw, 80px) var(--px) 28px;
      container-type: inline-size;
    }

    /* ── intro headline ── */
    .agent-intro { margin-bottom: clamp(28px, 4vw, 44px); }
    .agent-kicker {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 500; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--ink-3); margin-bottom: 20px;
    }
    .agent-kicker .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #34C759; box-shadow: 0 0 0 3px rgba(52, 199, 89, 0.15);
    }
    .agent-intro h1 {
      font-size: clamp(21px, 7cqw, 38px); font-weight: 700;
      letter-spacing: -0.03em; line-height: 1.14; color: var(--ink);
    }
    /* Font sizes to the column (cqw) so each line fits on one line in normal
       views; if the column is extremely narrow, wrap balanced — never orphan/clip */
    .agent-intro h1 .hl-line { display: block; text-wrap: balance; }
    .agent-intro h1 .muted { color: var(--ink-3); }

    /* ── thread ── */
    .thread { display: flex; flex-direction: column; gap: clamp(26px, 3.4vw, 34px); }
    .msg { display: flex; gap: 14px; max-width: 100%; }
    .msg--agent { align-items: flex-start; }
    .msg--user { justify-content: flex-end; }
    .msg {
      opacity: 0; transform: translateY(10px);
      animation: msgIn 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    @keyframes msgIn { to { opacity: 1; transform: none; } }

    .avatar {
      flex-shrink: 0; width: 34px; height: 34px; margin-top: 2px;
    }
    .avatar-mark { width: 34px; height: 34px; display: block; }
    .msg-content { display: flex; flex-direction: column; gap: 12px; min-width: 0; max-width: 100%; }
    .msg--agent .msg-content { flex: 1; }
    .msg-name { display: none; }
    /* Assistant: flat text on the page, no bubble (ChatGPT / Claude style) */
    .bubble {
      background: none; border: none; border-radius: 0; padding: 0;
      font-size: 16px; line-height: 1.7; color: var(--ink); max-width: 100%;
      white-space: pre-wrap;
    }
    /* User: white pill, no tail */
    .bubble--user {
      background: var(--bg); color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 18px; padding: 11px 17px;
      font-size: 15.5px; line-height: 1.55; max-width: 460px;
    }

    /* ── chips ── */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font-family: inherit; font-size: 14px; font-weight: 500; color: var(--ink);
      background: var(--bg); border: 1px solid var(--border); border-radius: 100px;
      padding: 9px 16px; cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .chip:hover { background: var(--surface); border-color: var(--ink-3); transform: translateY(-1px); }
    .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .chip .plus { color: var(--ink-3); font-size: 15px; line-height: 1; }

    /* ── first-time explore: option-card grid ── */
    .home-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: clamp(24px, 4vw, 36px); }
    @media (max-width: 520px) { .home-cards { grid-template-columns: 1fr; } }
    .home-card {
      position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
      width: 100%; text-align: left; font-family: inherit;
      padding: 20px; border: 1px solid var(--border); border-radius: 16px; background: var(--bg);
      cursor: pointer; color: inherit; text-decoration: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease, background 0.18s ease;
    }
    .home-card:hover { border-color: var(--ink-3); box-shadow: 0 10px 28px rgba(0,0,0,0.07); transform: translateY(-2px); }
    .home-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .home-card--featured { border-color: rgba(155, 107, 87, 0.4); }
    .home-card--featured:hover { border-color: rgba(155, 107, 87, 0.6); box-shadow: 0 10px 28px rgba(155, 107, 87, 0.12); }
    .home-card-icon { width: 42px; height: 42px; border-radius: 12px; background: var(--surface); display: inline-flex; align-items: center; justify-content: center; color: var(--ink); flex: 0 0 auto; }
    .home-card-icon svg { width: 22px; height: 22px; display: block; }
    .home-card--featured .home-card-icon { background: var(--accent-tint); color: var(--accent); }
    .home-card-text { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .home-card-title { font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
    .home-card-sub { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
    .home-card-featured { position: absolute; top: 14px; right: 14px; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); background: var(--accent-tint); border-radius: 100px; padding: 3px 8px; }

    /* ── Mobile: full-page empty state + compact list cards ──
       (placed after the base card/composer CSS so these win on source order) */
    @media (max-width: 900px) {
      /* greeting + cards fill the screen; composer docks at the bottom */
      .chat-pane.is-empty { justify-content: stretch; }
      .chat-pane.is-empty .chat-scroll { flex: 1 1 auto; overflow-y: auto; }
      .chat-pane.is-empty .chat-inner {
        min-height: 100%; display: flex; flex-direction: column; justify-content: center;
        padding-top: 16px; padding-bottom: 16px;
      }
      .chat-pane.is-empty .composer-bar {
        position: sticky; bottom: 0; border-top: 1px solid var(--border);
        background: var(--nav-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      }
      .agent-intro { margin-bottom: 6px; }
      /* compact horizontal cards so all four fit above the composer */
      .home-cards { gap: 10px; margin-top: clamp(18px, 5vw, 26px); }
      .home-card { flex-direction: row; align-items: center; gap: 14px; padding: 14px 16px; }
      .home-card-icon { width: 38px; height: 38px; border-radius: 10px; }
      .home-card-icon svg { width: 20px; height: 20px; }
      .home-card-text { flex: 1; gap: 2px; }
      .home-card-title { font-size: 14.5px; }
      .home-card-sub { font-size: 12.5px; line-height: 1.4; }
      .home-card-featured { position: static; align-self: flex-start; flex: 0 0 auto; }
    }

    /* ── streaming cursor ── */
    .stream-cursor {
      display: inline-block; width: 7px; height: 1.05em; margin-left: 1px;
      vertical-align: text-bottom; background: var(--accent); border-radius: 1px;
      animation: caret 1s steps(1) infinite;
    }
    @keyframes caret { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    .bubble strong { font-weight: 650; color: var(--ink); }

    /* ── follow-up suggestions ── */
    .chips--fu { margin-top: 6px; }
    .chip--fu {
      color: var(--ink-2); background: transparent; border-color: var(--border);
      border-radius: 100px; font-size: 13.5px; padding: 7px 15px;
    }
    .chip--fu:hover { color: var(--ink); background: var(--surface); border-color: var(--ink-3); }

    /* ── stop button (streaming) ── */
    .send-btn.is-stop { background: var(--surface); border-color: var(--border); color: var(--ink); }
    .send-btn.is-stop:hover { background: var(--surface-2, #f0f2f5); }
    .stop-square { width: 11px; height: 11px; border-radius: 2.5px; background: var(--ink); display: block; }

    /* ── typing (flat, no bubble) ── */
    .typing { display: inline-flex; gap: 5px; padding: 6px 2px; background: none; border: none; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: blink 1.3s infinite ease-in-out both; }
    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    /* ── thinking shimmer (frontier-LLM cue before streaming) ── */
    .thinking {
      display: inline-block; padding: 6px 2px;
      font-size: 15px; font-weight: 500; letter-spacing: -0.01em;
      background: linear-gradient(90deg, var(--ink-2) 20%, var(--ink) 45%, var(--ink) 55%, var(--ink-2) 80%);
      background-size: 220% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      animation: thinking-sweep 1.5s linear infinite;
    }
    .thinking::after { content: '…'; -webkit-text-fill-color: currentColor; color: var(--ink-3); }
    @keyframes thinking-sweep { to { background-position: -220% 0; } }
    @media (prefers-reduced-motion: reduce) {
      .thinking { animation: none; -webkit-text-fill-color: var(--ink-3); color: var(--ink-3); }
    }

    /* ── case study cards ── */
    .cs-cards { display: flex; flex-direction: column; gap: 12px; max-width: 560px; }
    .cs-card {
      position: relative; display: flex; align-items: center; gap: 18px; padding: 16px;
      border-radius: 14px; background: var(--bg); border: 1px solid var(--border);
      text-decoration: none; color: inherit;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .cs-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,0.08); }
    .cs-card--featured { border-color: rgba(155, 107, 87, 0.45); box-shadow: 0 4px 20px rgba(155, 107, 87, 0.10); }
    .cs-card--featured:hover { box-shadow: 0 14px 36px rgba(155, 107, 87, 0.16); }
    .cs-card-swatch { flex-shrink: 0; width: 64px; height: 64px; border-radius: 10px; overflow: hidden; }
    .cs-card-swatch img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cs-card-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
    .cs-card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .mini-tag {
      font-size: 10px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--ink-3); background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; padding: 2px 7px;
    }
    .cs-card-title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); line-height: 1.25; }
    .cs-card-impact { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
    .cs-card-arrow { flex-shrink: 0; color: var(--ink-3); transition: transform 0.25s ease, color 0.25s ease; }
    .cs-card:hover .cs-card-arrow { color: var(--ink); transform: translateX(3px); }
    .featured-pill {
      position: absolute; top: 12px; right: 12px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--on-ink); background: var(--accent); border-radius: 100px; padding: 3px 10px;
    }

    /* ── inline link buttons ── */
    .link-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .link-btn {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 14px; font-weight: 500; padding: 11px 18px; border-radius: 10px;
      text-decoration: none; cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .link-btn--primary { background: var(--ink); color: var(--on-ink); border: 1px solid var(--ink); }
    .link-btn--primary:hover { background: var(--btn-hover); transform: translateY(-1px); }
    .link-btn--secondary { background: transparent; color: var(--ink); border: 1px solid var(--border); }
    .link-btn--secondary:hover { border-color: var(--ink); transform: translateY(-1px); }

    /* ── composer (pinned to bottom of chat pane) ── */
    .composer-bar {
      border-top: 1px solid var(--border);
      background: var(--nav-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky; bottom: 0;
    }
    .composer-inner { max-width: 720px; margin: 0 auto; padding: 14px var(--px) 16px; position: relative; }
    /* soft scrim so the thread dissolves under the composer (docked state only) */
    .chat-pane:not(.is-empty) .composer-bar::before {
      content: ''; position: absolute; left: 0; right: 0; top: -44px; height: 44px;
      background: linear-gradient(to top, var(--bg), rgba(255, 255, 255, 0)); pointer-events: none;
    }
    .composer-form {
      display: flex; align-items: flex-end; gap: 8px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 26px;
      padding: 8px 8px 8px 18px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .composer-form:focus-within { border-color: var(--ink-3); box-shadow: 0 10px 34px rgba(0,0,0,0.09); }
    .composer-input {
      flex: 1; border: none; outline: none; background: transparent;
      font-family: inherit; font-size: 16px; line-height: 1.5; color: var(--ink);
      padding: 9px 0; resize: none; max-height: 200px; overflow-y: auto;
    }
    .composer-input::placeholder { color: var(--ink-3); }
    .send-btn {
      flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px; border: none;
      background: var(--ink); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
    }
    .send-btn:not(:disabled):hover { background: #222; transform: translateY(-1px); }
    .send-btn:disabled {
      background: var(--surface);
      color: var(--ink-3);
      cursor: default;
    }
    .composer-hint { font-size: 12px; color: var(--ink-3); margin-top: 10px; text-align: center; }

    /* ── message action row (copy / feedback) ── */
    .msg-actions { display: flex; gap: 2px; margin-top: 2px; opacity: 0; transition: opacity 0.18s ease; }
    .msg--agent:hover .msg-actions, .msg-actions:focus-within { opacity: 1; }
    @media (hover: none) { .msg-actions { opacity: 0.7; } }
    .act-btn {
      width: 30px; height: 30px; border-radius: 8px; border: none; background: none;
      color: var(--ink-3); cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .act-btn:hover { background: var(--surface); color: var(--ink); }
    .act-btn.is-on { color: var(--accent); }

    ::selection { background: rgba(155, 107, 87, 0.18); }

    /* ── side panel (floats as a rounded box, Claude-desktop style) ── */
    .panel {
      flex: 0 0 0%; min-width: 0; display: flex; flex-direction: column;
      background: var(--bg); overflow: hidden;
      border: 1px solid transparent; border-radius: 16px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0);
    }
    .panel-head {
      flex-shrink: 0; display: flex; align-items: center; gap: 12px;
      padding: 14px 16px 14px 20px; border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .panel-eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--ink-3); flex-shrink: 0;
    }
    .panel-title {
      font-size: 14px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
    }
    .panel-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .panel-btn {
      width: 34px; height: 34px; border-radius: 8px; border: none; background: transparent;
      color: var(--ink-3); cursor: pointer; display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: background 0.18s ease, color 0.18s ease;
    }
    .panel-btn:hover { background: var(--surface); color: var(--ink); }
    .panel-body { position: relative; flex: 1; min-height: 0; }
    #panel-frame {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
      background: var(--bg); opacity: 0; transition: opacity 0.25s ease;
    }
    #panel-frame.loaded { opacity: 1; }
    .panel-loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      gap: 8px; color: var(--ink-3); font-size: 13px; background: var(--surface);
    }
    .panel-loading.hidden { display: none; }
    .panel-loading .typing span { background: var(--ink-3); }

    /* ── mobile: panel becomes a full-screen overlay ── */
    @media (max-width: 899px) {
      .panel {
        position: fixed; inset: 0; z-index: 2000; width: 100%;
        height: 100dvh; border-left: none; border-radius: 0; transform: translateY(100%);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      /* full-screen overlay on mobile — reset the desktop floating box */
      .agent-wrap.panel-open .panel {
        transform: none; margin: 0; border: none; border-radius: 0; box-shadow: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .msg { animation: none; opacity: 1; transform: none; }
      .typing span { animation: none; opacity: 0.5; }
      .cs-card:hover, .link-btn:hover, .chip:hover, .send-btn:hover, .home-card:hover { transform: none; }
      .agent-wrap, .panel { transition: none; }

  <script>
    // ── Left rail (drawer on mobile) ──────────────────────────
    (function railToggle() {
      const app = document.getElementById('app');
      const scrim = document.getElementById('rail-scrim');
      const openBtn = document.getElementById('rail-open');
      const closeBtn = document.getElementById('rail-close');
      const rail = document.getElementById('rail');
      const open = () => { app.classList.add('rail-open'); scrim.hidden = false; openBtn.setAttribute('aria-expanded', 'true'); };
      const close = () => { app.classList.remove('rail-open'); scrim.hidden = true; openBtn.setAttribute('aria-expanded', 'false'); };
      openBtn.addEventListener('click', open);
      closeBtn.addEventListener('click', close);
      scrim.addEventListener('click', close);
      // Desktop: collapse / re-open the floating rail
      const collapseBtn = document.getElementById('rail-collapse');
      const showBtn = document.getElementById('rail-show');
      if (collapseBtn) collapseBtn.addEventListener('click', () => app.classList.add('rail-collapsed'));
      if (showBtn) showBtn.addEventListener('click', () => app.classList.remove('rail-collapsed'));
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && app.classList.contains('rail-open')) close(); });
      // Close the drawer after choosing anything in the rail (mobile).
      rail.addEventListener('click', (e) => {
        if (e.target.closest('.rail-item, .rail-recent-item, .rail-brand') && window.matchMedia('(max-width: 900px)').matches) close();
      });
      window.__railClose = close;
    })();

    // ── Theme toggle (light ⇆ dark, persisted) ───────────────
    (function () {
      const btn = document.getElementById('rail-theme');
      if (!btn) return;
      const icon = document.getElementById('rail-theme-icon');
      const label = document.getElementById('rail-theme-label');
      const SUN = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.6M12 18.9v2.6M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12h2.6M18.9 12h2.6M4.2 19.8l1.8-1.8M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
      const MOON = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 14.2A8 8 0 1 1 9.8 4a6.4 6.4 0 0 0 10.2 10.2z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>';
      const isDark = () => {
        const t = document.documentElement.getAttribute('data-theme');
        if (t) return t === 'dark';
        return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      };
      const paint = () => {
        const dark = isDark();
        icon.innerHTML = dark ? SUN : MOON;
        label.textContent = dark ? 'Light mode' : 'Dark mode';
      };
      paint();
      btn.addEventListener('click', () => {
        const next = isDark() ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) { /* ignore */ }
        paint();
      });
      if (window.matchMedia) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
          if (!document.documentElement.getAttribute('data-theme')) paint();
        });
      }
    })();

    // ── Side panel ───────────────────────────────────────────
    const Panel = (function () {
      const wrap = document.getElementById('agent-wrap');
      const panel = document.getElementById('panel');
      const frame = document.getElementById('panel-frame');
      const titleEl = document.getElementById('panel-title');
      const openFull = document.getElementById('panel-open-full');
      const loading = document.getElementById('panel-loading');
      const closeBtn = document.getElementById('panel-close');
      let lastOpener = null;

      function markEmbedded() {
        // Same-origin: hide the loaded page's own nav/footer for a clean preview.
        try { frame.contentDocument.documentElement.classList.add('embedded'); } catch (e) {}
      }

      frame.addEventListener('load', () => {
        markEmbedded();
        frame.classList.add('loaded');
        loading.classList.add('hidden');
      });

      function open(path, title, fullHref, opener) {
        lastOpener = opener || null;
        titleEl.textContent = title || 'Preview';
        openFull.href = fullHref || path;
        loading.classList.remove('hidden');
        frame.classList.remove('loaded');
        // Add embed flag so the page hides its chrome even before the load handler runs.
        frame.src = path + (path.indexOf('?') === -1 ? '?' : '&') + 'embed=1';
        wrap.classList.add('panel-open');
        panel.setAttribute('aria-hidden', 'false');
        panel.removeAttribute('inert');
        closeBtn.focus({ preventScroll: true });
      }

      function close() {
        wrap.classList.remove('panel-open');
        panel.setAttribute('aria-hidden', 'true');
        panel.setAttribute('inert', '');
        frame.classList.remove('loaded');
        // Free the iframe after the close transition.
        setTimeout(() => { if (!wrap.classList.contains('panel-open')) frame.src = 'about:blank'; }, 450);
        if (lastOpener && document.contains(lastOpener)) lastOpener.focus({ preventScroll: true });
      }

      closeBtn.addEventListener('click', close);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && wrap.classList.contains('panel-open')) close();
      });

      return { open, close };
    })();

    // Intercept internal links → open in the side panel instead of navigating.
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (!a || e.defaultPrevented) return;
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return; // let new-tab gestures through
      if (a.hasAttribute('download') || a.target === '_blank') return;
      const href = a.getAttribute('href');
      if (!href) return;
      const url = new URL(a.href, location.href);
      if (url.origin !== location.origin) return;                 // external
      if (url.protocol !== 'http:' && url.protocol !== 'https:') return; // mailto, tel
      if (url.pathname === '/' || url.pathname === '/index.html') return; // home / logo — stay

      const title =

        a.textContent.trim().replace(/\s+→$|\s+↗$|\s+↓$/, '') ||
        'Preview';
      Panel.open(url.pathname + url.search, title, url.href, a);

    // ── Portfolio Agent ──────────────────────────────────────

      const TYPING_MS = reduceMotion ? 120 : 620;

      // Funny redirects — used when a question isn't about Bri, or isn't in the wiki.
      const FUNNY = [
        "That's above my pay grade — and I work purely for exposure. Ask me about Bri's work instead?",

      const funny = () => FUNNY[Math.floor(Math.random() * FUNNY.length)];

      // ── The "wiki about Bri" ───────────────────────────────
      // Keyless knowledge base — no backend, no API, no cost. Each entry has
      // `keys` (lowercase trigger substrings) + `text` (the answer); optional
      // href/label add an "open the case study" link. Edit here to change what

      const KB = [
        { keys: ['who is', "who's bri", 'about bri', 'what does she do', 'what does bri do', 'what do you do', 'overview', 'summary', 'elevator', 'introduce'],
          text: "Bri May is an AI-native product designer and design engineer with about 10 years in product. She works in the seam between design and engineering — she designs AND builds, turning Figma systems into production React and shipping AI-native products end to end, on her own. Her work has driven 200%+ engagement growth, $12M+ in revenue, and reached 1M+ employees across Fortune 500 clients." },
        { keys: ['design engineer', 'do you code', 'does she code', 'can she code', 'she code', 'build it', 'builds', 'engineering', 'react', 'front-end', 'front end', 'frontend', 'developer', 'technical', 'hands on', 'hands-on'],
          text: "Yes — Bri is a design engineer. She doesn't just hand off mockups; she ships production front-ends in React (with Tailwind, Vite, design tokens, Framer Motion). She built the Global Content Studio app solo, end to end, and coded the Aimee front end herself. Designing and building in one loop is her edge." },
        { keys: ['global content studio', 'content studio', 'margin', 'federal reserve', 'content team', 'localization', 'localiz'],
          text: "Global Content Studio is a brand-trained AI content studio Bri designed AND built solo with Claude Code, end to end. It replaced the team's scattered, unregulated AI, then became a localization engine — an 8-step pipeline (Atlas) that adapts content for 25 countries. It localized ~650 pieces (16,250 outputs) in 25 days — work that would've cost ~$2.44M and 9 months by hand, so ~$2.42M saved — and helped win the Federal Reserve. In production for 1M+ employees.",
          href: '/work/global-content-studio/', title: 'Global Content Studio', label: 'Open the case study →' },
        { keys: ['aimee', 'coach', 'conversational', 'design system', 'component library', 'three surfaces', '3 surfaces', 'teams', 'widget', 'sdk'],
          text: "Aimee is Financial Finesse's AI financial coach. Bri designed and built the front end end-to-end — a documented design system, a locked component library, and coded interactive prototypes — and made one system ship to three surfaces: the Hub, an embeddable client-site widget, and Microsoft Teams. Signature calls: honest AI over “virtual assistant,” and the user's words never shrink.",
          href: '/aimee-ai/', title: 'Aimee AI Coach', label: 'Open the case study →' },
        { keys: ['hub', 'financial finesse hub', 'wellness platform', 'redesign', 'onboarding'],
          text: "The Financial Finesse Hub is a ground-up redesign Bri led as the lead product designer — turning a static content library into a personalized, guided system. It drove +200% engagement and $12M in revenue and won Fortune 500 clients. She led the design team from research to launch.",
          href: '/work/hub/', title: 'Financial Finesse Hub', label: 'Open the case study →' },
        { keys: ['smart benefits', 'open enrollment', 'enrollment', 'recordkeeper', 'embed mode'],
          text: "Smart Benefits is an AI-powered open-enrollment experience Bri designed with three white-label embed modes, adopted by one of the largest U.S. retirement recordkeepers. It's part of her work history — there's no dedicated case study for it on the site." },
        { keys: ['impact', 'results', 'metrics', 'numbers', 'revenue', 'engagement', 'outcomes', 'how much', 'roi'],
          text: "The headline numbers: 200%+ engagement growth, $12M+ in revenue contributed, and products reaching 1M+ employees across Fortune 500 clients. She also built Global Content Studio solo — localizing company content to 25 countries in 25 days, avoiding ~$2.42M in cost, and helping win the Federal Reserve." },

        const has = arr => arr.some(x => entry.keys.includes(x));
        if (entry.href === '/work/global-content-studio/') return [{ label: 'How did she build it solo?', q: 'does she code react' }, { label: 'What was the impact?', q: 'impact and results' }, { label: 'See Aimee next', q: 'aimee ai coach' }];
        if (entry.href === '/aimee-ai/') return [{ label: 'What did she design & build?', q: 'design engineer react' }, { label: 'Its three surfaces?', q: 'aimee three surfaces widget teams' }, { label: 'See the Hub next', q: 'financial finesse hub' }];
        if (entry.href === '/work/hub/') return [{ label: 'What drove the +200%?', q: 'impact results revenue' }, { label: 'Her AI build', q: 'global content studio' }, { label: 'See Aimee next', q: 'aimee ai coach' }];
        if (has(['design engineer','do you code','does she code','react'])) return [{ label: 'Show me proof', q: 'global content studio' }, { label: 'Her tech stack', q: 'skills stack' }, { label: 'Why that matters', q: 'why hire bri' }];
        if (has(['impact','results','metrics'])) return [{ label: 'Which project drove revenue?', q: 'financial finesse hub' }, { label: 'The solo AI build', q: 'global content studio' }, { label: 'Why hire her', q: 'why hire bri' }];
        if (has(['skills','tech','stack'])) return [{ label: 'Does she really code?', q: 'does she code' }, { label: 'Her AI work', q: 'ai native work' }, { label: 'See a build', q: 'global content studio' }];
        if (has(['ai ','ai-native','ai native'])) return [{ label: 'The AI she built solo', q: 'global content studio' }, { label: 'The Aimee coach', q: 'aimee ai coach' }, { label: 'Does she code?', q: 'does she code' }];
        if (has(['why hire','different','stand out'])) return [{ label: 'Show me the proof', q: 'global content studio' }, { label: 'The numbers', q: 'impact results' }, { label: 'How to reach her', intent: 'contact' }];
        if (has(['who is','about bri','overview'])) return [{ label: 'Her best work', intent: 'casestudies' }, { label: 'Does she code?', q: 'does she code' }, { label: 'Why hire her', q: 'why hire bri' }];
        if (has(['phone','contact','reach her'])) return [{ label: 'See her work first', intent: 'casestudies' }, { label: 'Why hire her', q: 'why hire bri' }];
        return [{ label: 'Her case studies', intent: 'casestudies' }, { label: 'Why hire her', q: 'why hire bri' }, { label: 'Get in touch', intent: 'contact' }];
      }
      function linkRow(entry) {
        return `<div class="link-row"><a class="link-btn link-btn--secondary" href="${entry.href}" data-panel-title="${esc(entry.title || '')}">${esc(entry.label || 'Open →')}</a></div>`;
      }
      function serveEntry(entry, alt) {
        lastEntry = entry; lastListShown = false;
        const res = { text: entry.text, block: entry.href ? linkRow(entry) : null, followups: followupsFor(entry) };
        if (alt) {
          res.text = 'Closest I have — tell me if I misread you: ' + entry.text;
          const label = (alt.keys.find(k => k.length >= 4) || alt.keys[0] || '').replace(/^\w/, c => c.toUpperCase());
          res.followups = [{ label: 'I meant: ' + label, q: alt.keys[0] }].concat(res.followups).slice(0, 4);
        }
        deliver(res);
      }

      // ── One-turn memory ──
      let lastEntry = null;
      let lastListShown = false;
      const ORD = { first: 0, '1st': 0, '1': 0, second: 1, '2nd': 1, '2': 1, third: 2, '3rd': 2, '3': 2, last: CASE_STUDIES.length - 1 };
      function ordinalIndex(s) {
        for (const w of s.split(' ')) if (w in ORD) return ORD[w];
        return null;
      }
      function isContinuation(s) {
        return s.split(' ').length <= 5 &&
          /^(tell me more|more|say more|go on|and\b|continue|elaborate|expand|keep going|deeper|go deeper|explain|details|and\?|why\??|really\??|so\??)$/.test(s.trim());
      }

      // ── Router: memory → retrieval (with confidence) → intent → redirect ──
      function route(q) {
        const s = norm(q);
        const ord = ordinalIndex(s);
        if (lastListShown && ord != null && CASE_STUDIES[ord]) {
          const entry = KB.find(e => e.href === CASE_STUDIES[ord].href);
          if (entry) { serveEntry(entry); return; }
        }
        if (isContinuation(s) && lastEntry) {
          const fu = followupsFor(lastEntry)[0];
          if (fu) { fu.intent ? respond(fu.intent) : route(fu.q); return; }
        }
        const r = retrieve(q);
        // Confident KB hit wins outright; navigation words beat a weak fuzzy hit.
        if (r.entry && r.score >= 2) { serveEntry(r.entry); return; }
        const intent = matchIntent(q);
        if (intent !== 'fallback') { respond(intent); return; }
        if (r.entry && r.score >= 1) { serveEntry(r.entry, r.second); return; }
        lastEntry = null; lastListShown = false;
        deliver({ text: funny(), followups: [{ label: 'Her case studies', intent: 'casestudies' }, { label: 'About Bri', intent: 'about' }, { label: 'Why hire her', q: 'why hire bri' }] });
      }

      function submitQuery(q, display) {
        q = (q || '').trim();
        if (!q) return;
        startChat();
        pushRecent({ label: display || q, q });
        addUserMessage(display || q);
        route(q);
      }

      // ── Recent (rail history) ──
      const recents = [];
      const recentWrap = document.getElementById('rail-recent');
      const recentList = document.getElementById('rail-recent-list');
      function pushRecent(item) {
        const key = item.label.trim().toLowerCase();
        const i = recents.findIndex(r => r.label.trim().toLowerCase() === key);
        if (i > -1) recents.splice(i, 1);
        recents.unshift(item);
        if (recents.length > 8) recents.length = 8;
        recentList.innerHTML = '';
        recents.forEach(r => {
          const btn = document.createElement('button');
          btn.className = 'rail-recent-item'; btn.type = 'button';
          btn.textContent = r.label; btn.title = r.label;
          btn.addEventListener('click', () => {
            if (busy) return;
            if (r.intent) handleIntent(r.intent, r.label);
            else submitQuery(r.q, r.label);
          });
          recentList.appendChild(btn);
        });
        recentWrap.hidden = recents.length === 0;
      }

      // ── Empty state ⇄ active chat ──
      const chatPane = document.getElementById('chat-pane');
      let started = false;
      function startChat() {
        if (started) return;
        started = true;
        chatPane.classList.remove('is-empty');
      }
      function resetChat() {
        started = false;
        thread.innerHTML = '';
        lastEntry = null; lastListShown = false;
        if (active) { active.finish && active.finish(); active = null; }
        busy = false; setComposerState(false);
        chatPane.classList.add('is-empty');
        input.value = ''; autogrow();
        scroller.scrollTop = 0;
        if (window.__railClose) window.__railClose();
        input.focus({ preventScroll: true });
      }
      document.getElementById('rail-newchat').addEventListener('click', resetChat);
      document.getElementById('topbar-newchat').addEventListener('click', resetChat);

      // Mount the explore list into the empty state.
      document.getElementById('starter-mount').appendChild(buildStarter());

      // ── Composer: auto-grow textarea, Enter to send, disabled when empty ──
      function autogrow() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 200) + 'px';
      }
      function syncSend() { if (!sendBtn.classList.contains('is-stop')) sendBtn.disabled = !input.value.trim(); }
      input.addEventListener('input', () => { autogrow(); syncSend(); });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
      });
      syncSend();

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (busy) return;
        const q = input.value.trim();
        if (!q) return;
        input.value = ''; autogrow(); syncSend();
        submitQuery(q);
      });
      // Send button doubles as a stop control while Brix is streaming.
      sendBtn.addEventListener('click', (e) => {
        if (sendBtn.classList.contains('is-stop') && active) { e.preventDefault(); active.finish(); }
      });
    })();
  </script>
