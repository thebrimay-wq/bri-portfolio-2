<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bri May — Senior Product Designer & Creative Director. Ask the portfolio agent to show you case studies, Bri's background, résumé, or contact info." />
  <title>Bri May — Product Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/site.css" />

  <style>
    /* ============================================================
       AGENT HOMEPAGE — chat rail + artifact-style side panel
       A scripted portfolio concierge. Internal links open in a
       right-side panel (iframe) instead of navigating away.
    ============================================================ */

    html, body { height: 100%; }

    /* ── App shell: chat pane | side panel ── */
    .agent-wrap {
      display: grid;
      grid-template-columns: 1fr 0fr;
      height: calc(100dvh - var(--nav-h, 65px));
      overflow: hidden;
    }
    @media (min-width: 900px) {
      .agent-wrap { transition: grid-template-columns 0.45s cubic-bezier(0.4, 0, 0.2, 1); }
      .agent-wrap.panel-open { grid-template-columns: minmax(360px, 43fr) 57fr; }
    }

    /* ── Chat pane ── */
    .chat-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }
    .chat-scroll { flex: 1; overflow-y: auto; }
    .chat-inner {
      max-width: 780px;
      margin: 0 auto;
      padding: clamp(36px, 6vw, 80px) var(--px) 24px;
    }

    /* ── intro headline ── */
    .agent-intro { margin-bottom: clamp(28px, 4vw, 44px); }
    .agent-kicker {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 500; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--ink-3); margin-bottom: 20px;
    }
    .agent-kicker .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #34C759; box-shadow: 0 0 0 3px rgba(52, 199, 89, 0.15);
    }
    .agent-intro h1 {
      font-size: clamp(28px, 4vw, 44px); font-weight: 700;
      letter-spacing: -0.03em; line-height: 1.1; color: var(--ink); max-width: 620px;
    }
    .agent-intro h1 .muted { color: var(--ink-3); }

    /* ── thread ── */
    .thread { display: flex; flex-direction: column; gap: clamp(20px, 3vw, 28px); }
    .msg { display: flex; gap: 12px; max-width: 100%; }
    .msg--agent { align-items: flex-start; }
    .msg--user { justify-content: flex-end; }
    .msg {
      opacity: 0; transform: translateY(10px);
      animation: msgIn 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    @keyframes msgIn { to { opacity: 1; transform: none; } }

    .avatar {
      flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
      background: #0A0A0A;
      display: flex; align-items: center; justify-content: center; color: #fff; margin-top: 2px;
    }
    .avatar-mark { width: 34px; height: 34px; display: block; }
    .msg-content { display: flex; flex-direction: column; gap: 14px; min-width: 0; max-width: 100%; }
    .msg-name {
      font-size: 12px; font-weight: 600; letter-spacing: 0.01em;
      color: var(--ink-3); margin-bottom: -4px;
    }
    .bubble {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px; padding: 14px 18px;
      font-size: clamp(15px, 1.15vw, 16px); line-height: 1.6; color: var(--ink); max-width: 560px;
    }
    .bubble--user {
      background: var(--ink); color: #fff; border: none;
      border-radius: 16px 16px 4px 16px; max-width: 420px;
    }

    /* ── chips ── */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font-family: inherit; font-size: 14px; font-weight: 500; color: var(--ink);
      background: var(--bg); border: 1px solid var(--border); border-radius: 100px;
      padding: 9px 16px; cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .chip:hover { background: var(--surface); border-color: var(--ink-3); transform: translateY(-1px); }
    .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .chip .plus { color: var(--ink-3); font-size: 15px; line-height: 1; }

    /* ── typing ── */
    .typing { display: inline-flex; gap: 5px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: blink 1.3s infinite ease-in-out both; }
    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    /* ── case study cards ── */
    .cs-cards { display: flex; flex-direction: column; gap: 12px; max-width: 560px; }
    .cs-card {
      position: relative; display: flex; align-items: center; gap: 18px; padding: 16px;
      border-radius: 14px; background: var(--bg); border: 1px solid var(--border);
      text-decoration: none; color: inherit;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .cs-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,0.08); }
    .cs-card--featured { border-color: rgba(155, 107, 87, 0.45); box-shadow: 0 4px 20px rgba(155, 107, 87, 0.10); }
    .cs-card--featured:hover { box-shadow: 0 14px 36px rgba(155, 107, 87, 0.16); }
    .cs-card-swatch { flex-shrink: 0; width: 64px; height: 64px; border-radius: 10px; }
    .cs-card-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
    .cs-card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .mini-tag {
      font-size: 10px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--ink-3); background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; padding: 2px 7px;
    }
    .cs-card-title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); line-height: 1.25; }
    .cs-card-impact { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
    .cs-card-arrow { flex-shrink: 0; color: var(--ink-3); transition: transform 0.25s ease, color 0.25s ease; }
    .cs-card:hover .cs-card-arrow { color: var(--ink); transform: translateX(3px); }
    .featured-pill {
      position: absolute; top: 12px; right: 12px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: #fff; background: var(--accent); border-radius: 100px; padding: 3px 10px;
    }

    /* ── inline link buttons ── */
    .link-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .link-btn {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 14px; font-weight: 500; padding: 11px 18px; border-radius: 10px;
      text-decoration: none; cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .link-btn--primary { background: var(--ink); color: #fff; border: 1px solid var(--ink); }
    .link-btn--primary:hover { background: #222; transform: translateY(-1px); }
    .link-btn--secondary { background: transparent; color: var(--ink); border: 1px solid var(--border); }
    .link-btn--secondary:hover { border-color: var(--ink); transform: translateY(-1px); }

    /* ── composer (pinned to bottom of chat pane) ── */
    .composer-bar {
      border-top: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky; bottom: 0;
    }
    .composer-inner { max-width: 780px; margin: 0 auto; padding: 16px var(--px) 18px; }
    .composer-form {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 100px;
      padding: 7px 7px 7px 20px; transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .composer-form:focus-within { border-color: var(--ink); box-shadow: 0 6px 24px rgba(0,0,0,0.06); }
    .composer-input {
      flex: 1; border: none; outline: none; background: transparent;
      font-family: inherit; font-size: 15px; color: var(--ink); padding: 8px 0;
    }
    .composer-input::placeholder { color: var(--ink-3); }
    .send-btn {
      flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; border: none;
      background: var(--ink); color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .send-btn:hover { background: #222; transform: translateY(-1px); }
    .composer-hint { font-size: 12px; color: var(--ink-3); margin-top: 10px; padding-left: 4px; }

    /* ── side panel (floats as a rounded box, Claude-desktop style) ── */
    .panel {
      min-width: 0; display: flex; flex-direction: column;
      background: var(--bg); overflow: hidden;
    }
    .agent-wrap.panel-open .panel {
      margin: 14px 16px 16px 8px;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.12);
    }
    .panel-head {
      flex-shrink: 0; display: flex; align-items: center; gap: 12px;
      padding: 14px 16px 14px 20px; border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .panel-eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--ink-3); flex-shrink: 0;
    }
    .panel-title {
      font-size: 14px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
    }
    .panel-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .panel-btn {
      width: 34px; height: 34px; border-radius: 8px; border: none; background: transparent;
      color: var(--ink-3); cursor: pointer; display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: background 0.18s ease, color 0.18s ease;
    }
    .panel-btn:hover { background: var(--surface); color: var(--ink); }
    .panel-body { position: relative; flex: 1; min-height: 0; }
    #panel-frame {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
      background: var(--bg); opacity: 0; transition: opacity 0.25s ease;
    }
    #panel-frame.loaded { opacity: 1; }
    .panel-loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      gap: 8px; color: var(--ink-3); font-size: 13px; background: var(--surface);
    }
    .panel-loading.hidden { display: none; }
    .panel-loading .typing span { background: var(--ink-3); }

    /* ── mobile: panel becomes a full-screen overlay ── */
    @media (max-width: 899px) {
      .agent-wrap { display: block; height: auto; overflow: visible; }
      .chat-pane { overflow: visible; min-height: calc(100dvh - var(--nav-h, 65px)); }
      .chat-scroll { overflow: visible; }
      .panel {
        position: fixed; inset: 0; z-index: 2000; width: 100%;
        height: 100dvh; border-left: none; transform: translateY(100%);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      /* full-screen overlay on mobile — reset the desktop floating box */
      .agent-wrap.panel-open .panel {
        transform: none; margin: 0; border: none; border-radius: 0; box-shadow: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .msg { animation: none; opacity: 1; transform: none; }
      .typing span { animation: none; opacity: 0.5; }
      .cs-card:hover, .link-btn:hover, .chip:hover, .send-btn:hover { transform: none; }
      .agent-wrap, .panel { transition: none; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">Bri May</a>
      <ul class="nav-links">
        <li><a href="/work/" class="nav-link">Work</a></li>
        <li><a href="/about/" class="nav-link">About</a></li>
        <li><a href="/resume/" class="nav-link">Résumé</a></li>
        <li><a href="/contact/" class="nav-link">Contact</a></li>
      </ul>
    </div>
  </nav>

  <div class="agent-wrap" id="agent-wrap">

    <!-- CHAT PANE -->
    <section class="chat-pane">
      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-inner">
          <div class="agent-intro">
            <span class="agent-kicker"><span class="status-dot"></span>Brix · Bri's portfolio agent</span>
            <h1>What would you like to see?<br><span class="muted">Ask me about Bri's work.</span></h1>
          </div>
          <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation with Brix"></div>
        </div>
      </div>

      <div class="composer-bar">
        <div class="composer-inner">
          <form class="composer-form" id="composer-form" autocomplete="off">
            <label for="composer-input" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Ask Brix</label>
            <input
              type="text" id="composer-input" class="composer-input"
              placeholder="Ask Brix — try &ldquo;case studies&rdquo;, &ldquo;about Bri&rdquo;, or &ldquo;résumé&rdquo;&hellip;"
              aria-label="Ask Brix"
            />
            <button type="submit" class="send-btn" id="send-btn" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>
          <p class="composer-hint">Guided agent — pick a suggestion or type what you're looking for. Pages open on the right. ↗</p>
        </div>
      </div>
    </section>

    <!-- SIDE PANEL -->
    <aside class="panel" id="panel" aria-hidden="true" aria-label="Page preview" inert>
      <div class="panel-head">
        <span class="panel-eyebrow" aria-hidden="true">Preview</span>
        <span class="panel-title" id="panel-title">&nbsp;</span>
        <div class="panel-actions">
          <a class="panel-btn" id="panel-open-full" href="#" target="_blank" rel="noopener" title="Open full page in a new tab" aria-label="Open full page in a new tab">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <button class="panel-btn" id="panel-close" title="Close panel" aria-label="Close panel">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="panel-body">
        <iframe id="panel-frame" title="Page preview" src="about:blank"></iframe>
        <div class="panel-loading hidden" id="panel-loading"><span class="typing"><span></span><span></span><span></span></span></div>
      </div>
    </aside>

  </div>

  <script>
    // ── Measure nav height for the app-shell viewport math ──
    (function setNavH() {
      const nav = document.getElementById('site-nav');
      const set = () => document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
      set();
      window.addEventListener('resize', set, { passive: true });
    })();

    // ── Side panel ───────────────────────────────────────────
    const Panel = (function () {
      const wrap = document.getElementById('agent-wrap');
      const panel = document.getElementById('panel');
      const frame = document.getElementById('panel-frame');
      const titleEl = document.getElementById('panel-title');
      const openFull = document.getElementById('panel-open-full');
      const loading = document.getElementById('panel-loading');
      const closeBtn = document.getElementById('panel-close');
      let lastOpener = null;

      function markEmbedded() {
        // Same-origin: hide the loaded page's own nav/footer for a clean preview.
        try { frame.contentDocument.documentElement.classList.add('embedded'); } catch (e) {}
      }

      frame.addEventListener('load', () => {
        markEmbedded();
        frame.classList.add('loaded');
        loading.classList.add('hidden');
      });

      function open(path, title, fullHref, opener) {
        lastOpener = opener || null;
        titleEl.textContent = title || 'Preview';
        openFull.href = fullHref || path;
        loading.classList.remove('hidden');
        frame.classList.remove('loaded');
        // Add embed flag so the page hides its chrome even before the load handler runs.
        frame.src = path + (path.indexOf('?') === -1 ? '?' : '&') + 'embed=1';
        wrap.classList.add('panel-open');
        panel.setAttribute('aria-hidden', 'false');
        panel.removeAttribute('inert');
        closeBtn.focus({ preventScroll: true });
      }

      function close() {
        wrap.classList.remove('panel-open');
        panel.setAttribute('aria-hidden', 'true');
        panel.setAttribute('inert', '');
        frame.classList.remove('loaded');
        // Free the iframe after the close transition.
        setTimeout(() => { if (!wrap.classList.contains('panel-open')) frame.src = 'about:blank'; }, 450);
        if (lastOpener && document.contains(lastOpener)) lastOpener.focus({ preventScroll: true });
      }

      closeBtn.addEventListener('click', close);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && wrap.classList.contains('panel-open')) close();
      });

      return { open, close };
    })();

    // Intercept internal links → open in the side panel instead of navigating.
    document.addEventListener('click', (e) => {
      const a = e.target.closest('a');
      if (!a || e.defaultPrevented) return;
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return; // let new-tab gestures through
      if (a.hasAttribute('download') || a.target === '_blank') return;
      const href = a.getAttribute('href');
      if (!href) return;
      const url = new URL(a.href, location.href);
      if (url.origin !== location.origin) return;                 // external
      if (url.protocol !== 'http:' && url.protocol !== 'https:') return; // mailto, tel
      if (url.pathname === '/' || url.pathname === '/index.html') return; // home / logo — stay
      if (url.pathname === location.pathname && url.hash) return; // in-page anchor
      e.preventDefault();
      const title =
        a.dataset.panelTitle ||
        (a.querySelector('.cs-card-title') && a.querySelector('.cs-card-title').textContent) ||
        a.textContent.trim().replace(/\s+→$|\s+↗$|\s+↓$/, '') ||
        'Preview';
      Panel.open(url.pathname + url.search, title, url.href, a);
    });

    // Nav scroll state (subtle border)
    const nav = document.getElementById('site-nav');
    document.getElementById('chat-scroll').addEventListener('scroll', function () {
      nav.classList.toggle('scrolled', this.scrollTop > 8);
    }, { passive: true });

    // ── Portfolio Agent ──────────────────────────────────────
    (function () {
      const thread = document.getElementById('thread');
      const scroller = document.getElementById('chat-scroll');
      const form = document.getElementById('composer-form');
      const input = document.getElementById('composer-input');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const TYPING_MS = reduceMotion ? 120 : 620;

      const CASE_STUDIES = [
        { featured: true, title: 'Global Content Studio', href: '/work/global-content-studio/', swatch: '#EDE6DC', tags: ['AI Product', 'Solo Build'], impact: 'Brand-trained AI content studio, designed and built solo — 1M+ employees, 5 locales.' },
        { title: 'Financial Wellness Hub', href: '/work/hub/', swatch: '#EBE8F4', tags: ['Platform Design', 'UX Strategy'], impact: 'A redesign that drove +200% engagement and $12M in revenue.' },
        { title: 'Aimee AI Coach', href: '/aimee-ai/', swatch: '#E2E7F0', tags: ['AI Experience', 'Product Design'], impact: 'A conversational AI coach reaching 1M+ employees.' }
      ];

      const CHIP_LABELS = { casestudies: 'Case studies', about: 'About Bri', resume: 'Résumé', contact: 'Contact' };

      const arrowSvg = '<svg class="cs-card-arrow" width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      function esc(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

      function caseCardsHtml() {
        return '<div class="cs-cards">' + CASE_STUDIES.map(cs => `
          <a class="cs-card${cs.featured ? ' cs-card--featured' : ''}" href="${cs.href}" data-panel-title="${esc(cs.title)}">
            ${cs.featured ? '<span class="featured-pill">Featured</span>' : ''}
            <span class="cs-card-swatch" style="background:${cs.swatch}"></span>
            <span class="cs-card-body">
              <span class="cs-card-tags">${cs.tags.map(t => `<span class="mini-tag">${t}</span>`).join('')}</span>
              <span class="cs-card-title">${cs.title}</span>
              <span class="cs-card-impact">${cs.impact}</span>
            </span>
            ${arrowSvg}
          </a>`).join('') + '</div>';
      }

      const RESPONSES = {
        casestudies: () => ({
          text: "Here's Bri's selected work. I'd start with the featured one — Global Content Studio, an AI content studio she designed and built solo, end to end. Tap any card to open it here.",
          block: caseCardsHtml(),
          chips: ['about', 'resume', 'contact']
        }),
        about: () => ({
          text: "Bri May is an AI-native product designer and creative director — a decade in product, designing since 2011, working in the seam between design and engineering. She's shipped for companies like Meta, the NFL, and JPMorgan, and now designs and builds AI products end to end.",
          block: '<div class="link-row"><a class="link-btn link-btn--primary" href="/about/" data-panel-title="About Bri">Read the full story →</a></div>',
          chips: ['casestudies', 'resume', 'contact']
        }),
        resume: () => ({
          text: "The short version: an AI-native product designer & creative director — ten years in the seam between design and engineering, shipping production React front-ends and AI products end to end. Want the full detail?",
          block: '<div class="link-row"><a class="link-btn link-btn--primary" href="/resume/" data-panel-title="Résumé">View résumé →</a><a class="link-btn link-btn--secondary" href="/resume/BriMay_Resume_2026.pdf" download>Download PDF ↓</a></div>',
          chips: ['casestudies', 'about', 'contact']
        }),
        contact: () => ({
          text: "Bri's currently exploring senior product design roles. Here are the best ways to reach her:",
          block: '<div class="link-row"><a class="link-btn link-btn--primary" href="mailto:thebrimay@gmail.com">Email Bri</a><a class="link-btn link-btn--secondary" href="https://www.linkedin.com/in/brimay" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a><a class="link-btn link-btn--secondary" href="/contact/" data-panel-title="Contact">Contact page →</a></div>',
          chips: ['casestudies', 'about', 'resume']
        }),
        greet: () => ({ text: "Hey! Here's what I can help you explore:", block: null, chips: ['casestudies', 'about', 'resume', 'contact'] }),
        fallback: () => ({ text: "I'm not sure I caught that — but I can show you Bri's case studies, her background, her résumé, or how to get in touch. Pick one:", block: null, chips: ['casestudies', 'about', 'resume', 'contact'] })
      };

      function matchIntent(q) {
        const s = q.toLowerCase();
        const has = arr => arr.some(k => s.includes(k));
        if (has(['resume', 'résumé', 'resumé', 'cv', 'curriculum'])) return 'resume';
        if (has(['contact', 'email', 'hire', 'reach', 'linkedin', 'touch', 'available', 'connect', 'message', 'get in'])) return 'contact';
        if (has(['case', 'work', 'project', 'portfolio', 'studies', 'study', 'global content', 'content studio', 'aimee', 'hub', 'benefits', 'featured'])) return 'casestudies';
        if (has(['about', 'who', 'bri', 'background', 'bio', 'story', 'experience', 'career'])) return 'about';
        if (has(['hi', 'hello', 'hey', 'yo', 'sup', 'howdy'])) return 'greet';
        return 'fallback';
      }

      function elFromHtml(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
      function scrollToEnd() { scroller.scrollTo({ top: scroller.scrollHeight, behavior: reduceMotion ? 'auto' : 'smooth' }); }

      function addUserMessage(text) {
        const msg = document.createElement('div');
        msg.className = 'msg msg--user';
        const bubble = document.createElement('div');
        bubble.className = 'bubble bubble--user';
        bubble.textContent = text;
        msg.appendChild(bubble);
        thread.appendChild(msg);
      }

      function buildChips(ids) {
        const wrap = document.createElement('div');
        wrap.className = 'chips';
        ids.forEach(id => {
          const btn = document.createElement('button');
          btn.className = 'chip'; btn.type = 'button'; btn.dataset.intent = id;
          btn.innerHTML = '<span class="plus">+</span>' + esc(CHIP_LABELS[id] || id);
          btn.addEventListener('click', () => handleIntent(id, CHIP_LABELS[id] || id));
          wrap.appendChild(btn);
        });
        return wrap;
      }

      function addAgentMessage(res) {
        const msg = elFromHtml(`
          <div class="msg msg--agent">
            <div class="avatar"><svg class="avatar-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="12.5" stroke="#fff" stroke-width="1.5"/><path d="M11.6 26.6 29 12.8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><text x="20" y="25.4" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fff">B</text></svg></div>
            <div class="msg-content"><div class="msg-name">Brix</div></div>
          </div>`);
        const content = msg.querySelector('.msg-content');
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = res.text;
        content.appendChild(bubble);
        if (res.block) content.appendChild(elFromHtml(res.block));
        if (res.chips && res.chips.length) content.appendChild(buildChips(res.chips));
        thread.appendChild(msg);
      }

      function showTyping() {
        const msg = elFromHtml(`
          <div class="msg msg--agent" data-typing="1">
            <div class="avatar"><svg class="avatar-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="12.5" stroke="#fff" stroke-width="1.5"/><path d="M11.6 26.6 29 12.8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><text x="20" y="25.4" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#fff">B</text></svg></div>
            <div class="msg-content"><div class="typing" aria-label="Agent is typing"><span></span><span></span><span></span></div></div>
          </div>`);
        thread.appendChild(msg);
        scrollToEnd();
        return msg;
      }

      let busy = false;
      function respond(intentId) {
        const res = (RESPONSES[intentId] || RESPONSES.fallback)();
        const typing = showTyping();
        busy = true;
        setTimeout(() => {
          typing.remove();
          addAgentMessage(res);
          busy = false;
          scrollToEnd();
          input.focus({ preventScroll: true });
        }, TYPING_MS);
      }

      function handleIntent(intentId, userLabel) {
        if (busy) return;
        if (userLabel) addUserMessage(userLabel);
        respond(intentId);
      }
      window.__handleIntent = handleIntent;

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const q = input.value.trim();
        if (!q || busy) return;
        input.value = '';
        addUserMessage(q);
        respond(matchIntent(q));
      });

      addAgentMessage({
        text: "Hi — I'm Brix, Bri's portfolio agent. I can walk you through her case studies, give you the quick version of her background, or pull up her résumé and contact info. Where would you like to start?",
        block: null,
        chips: ['casestudies', 'about', 'resume', 'contact']
      });
    })();
  </script>

</body>
</html>
