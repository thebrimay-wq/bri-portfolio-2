<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bri May — Senior Product Designer & Creative Director. Ask the portfolio agent to show you case studies, Bri's background, résumé, or contact info." />
  <title>Bri May — Product Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/site.css" />

  <style>
    /* ============================================================
       AGENT HOMEPAGE
       A scripted portfolio concierge — suggested prompts + free
       text route to intents, responses render inline as a thread.
    ============================================================ */

    .agent-stage {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      padding: clamp(40px, 7vw, 88px) var(--px) clamp(48px, 8vw, 96px);
      min-height: calc(100vh - 68px);
      display: flex;
      flex-direction: column;
    }

    /* ── intro headline (above the thread) ── */
    .agent-intro {
      margin-bottom: clamp(28px, 4vw, 44px);
    }
    .agent-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 20px;
    }
    .agent-kicker .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34C759;
      box-shadow: 0 0 0 3px rgba(52, 199, 89, 0.15);
    }
    .agent-intro h1 {
      font-size: clamp(28px, 4vw, 44px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--ink);
      max-width: 620px;
    }
    .agent-intro h1 .muted { color: var(--ink-3); }

    /* ── thread ── */
    .thread {
      display: flex;
      flex-direction: column;
      gap: clamp(20px, 3vw, 28px);
      flex: 1;
    }

    .msg { display: flex; gap: 12px; max-width: 100%; }
    .msg--agent { align-items: flex-start; }
    .msg--user { justify-content: flex-end; }

    /* animate new messages in */
    .msg {
      opacity: 0;
      transform: translateY(10px);
      animation: msgIn 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }
    @keyframes msgIn { to { opacity: 1; transform: none; } }

    .avatar {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0A0A0A 0%, #9B6B57 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      margin-top: 2px;
    }

    .msg-content { display: flex; flex-direction: column; gap: 14px; min-width: 0; max-width: 100%; }
    .msg-name {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--ink-3);
      margin-bottom: -4px;
    }

    .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
      padding: 14px 18px;
      font-size: clamp(15px, 1.15vw, 16px);
      line-height: 1.6;
      color: var(--ink);
      max-width: 560px;
    }
    .bubble--user {
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 16px 16px 4px 16px;
      max-width: 420px;
    }

    /* ── suggestion chips ── */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 9px 16px;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .chip:hover { background: var(--surface); border-color: var(--ink-3); transform: translateY(-1px); }
    .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .chip .plus { color: var(--ink-3); font-size: 15px; line-height: 1; }

    /* ── typing indicator ── */
    .typing { display: inline-flex; gap: 5px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3);
      animation: blink 1.3s infinite ease-in-out both;
    }
    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

    /* ── case study cards ── */
    .cs-cards { display: flex; flex-direction: column; gap: 12px; max-width: 560px; }
    .cs-card {
      position: relative;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 16px;
      border-radius: 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }
    .cs-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,0.08); }
    .cs-card--featured {
      border-color: rgba(155, 107, 87, 0.45);
      box-shadow: 0 4px 20px rgba(155, 107, 87, 0.10);
    }
    .cs-card--featured:hover { box-shadow: 0 14px 36px rgba(155, 107, 87, 0.16); }

    .cs-card-swatch {
      flex-shrink: 0;
      width: 64px;
      height: 64px;
      border-radius: 10px;
    }
    .cs-card-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
    .cs-card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
    .mini-tag {
      font-size: 10px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--ink-3); background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; padding: 2px 7px;
    }
    .cs-card-title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); line-height: 1.25; }
    .cs-card-impact { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
    .cs-card-arrow { flex-shrink: 0; color: var(--ink-3); transition: transform 0.25s ease, color 0.25s ease; }
    .cs-card:hover .cs-card-arrow { color: var(--ink); transform: translateX(3px); }

    .featured-pill {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      background: var(--accent);
      border-radius: 100px;
      padding: 3px 10px;
    }

    /* ── inline link buttons (about / resume / contact blocks) ── */
    .link-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .link-btn {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 14px; font-weight: 500;
      padding: 11px 18px; border-radius: 10px;
      text-decoration: none; cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }
    .link-btn--primary { background: var(--ink); color: #fff; border: 1px solid var(--ink); }
    .link-btn--primary:hover { background: #222; transform: translateY(-1px); }
    .link-btn--secondary { background: transparent; color: var(--ink); border: 1px solid var(--border); }
    .link-btn--secondary:hover { border-color: var(--ink); transform: translateY(-1px); }

    /* ── composer ── */
    .composer { margin-top: clamp(28px, 4vw, 40px); }
    .composer-form {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 7px 7px 7px 20px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .composer-form:focus-within { border-color: var(--ink); box-shadow: 0 6px 24px rgba(0,0,0,0.06); }
    .composer-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 15px;
      color: var(--ink);
      padding: 8px 0;
    }
    .composer-input::placeholder { color: var(--ink-3); }
    .send-btn {
      flex-shrink: 0;
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: var(--ink);
      color: #fff;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .send-btn:hover { background: #222; transform: translateY(-1px); }
    .send-btn:disabled { opacity: 0.35; cursor: default; transform: none; }
    .composer-hint {
      font-size: 12px;
      color: var(--ink-3);
      margin-top: 12px;
      padding-left: 4px;
    }

    @media (max-width: 560px) {
      .bubble, .bubble--user, .cs-cards { max-width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .msg { animation: none; opacity: 1; transform: none; }
      .typing span { animation: none; opacity: 0.5; }
      .cs-card:hover, .link-btn:hover, .chip:hover, .send-btn:hover { transform: none; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav id="site-nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">Bri May</a>
      <ul class="nav-links">
        <li><a href="/work/" class="nav-link">Work</a></li>
        <li><a href="/about/" class="nav-link">About</a></li>
        <li><a href="/resume/" class="nav-link">Résumé</a></li>
        <li><a href="/contact/" class="nav-link">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="agent-stage">

      <div class="agent-intro">
        <span class="agent-kicker"><span class="status-dot"></span>Portfolio Agent</span>
        <h1>What would you like to see?<br><span class="muted">Ask me about Bri's work.</span></h1>
      </div>

      <!-- Conversation thread — messages are injected here -->
      <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Conversation with the portfolio agent"></div>

      <!-- Composer -->
      <div class="composer">
        <form class="composer-form" id="composer-form" autocomplete="off">
          <label for="composer-input" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Ask the portfolio agent</label>
          <input
            type="text"
            id="composer-input"
            class="composer-input"
            placeholder="Try &ldquo;case studies&rdquo;, &ldquo;about Bri&rdquo;, or &ldquo;résumé&rdquo;&hellip;"
            aria-label="Ask the portfolio agent"
          />
          <button type="submit" class="send-btn" id="send-btn" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
        <p class="composer-hint">This is a guided agent — pick a suggestion or type what you're looking for.</p>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <span class="footer-left">Bri May</span>
      <div class="footer-links">
        <a href="mailto:thebrimay@gmail.com">thebrimay@gmail.com</a>
        <a href="https://www.linkedin.com/in/brimay" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
      </div>
      <span class="footer-right">© 2025 Bri May</span>
    </div>
  </footer>

  <script>
    // ── Nav scroll state ──
    const nav = document.getElementById('site-nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 8);
    }, { passive: true });

    // ── Portfolio Agent ──────────────────────────────────────
    (function () {
      const thread = document.getElementById('thread');
      const form = document.getElementById('composer-form');
      const input = document.getElementById('composer-input');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const TYPING_MS = reduceMotion ? 120 : 620;

      const CASE_STUDIES = [
        {
          featured: true,
          title: 'Global Content Studio',
          href: '/work/global-content-studio/',
          swatch: '#EDE6DC',
          tags: ['AI Product', 'Solo Build'],
          impact: 'Brand-trained AI content studio, designed and built solo — 1M+ employees, 5 locales.'
        },
        {
          title: 'Financial Wellness Hub',
          href: '/work/hub/',
          swatch: '#EBE8F4',
          tags: ['Platform Design', 'UX Strategy'],
          impact: 'A redesign that drove +200% engagement and $12M in revenue.'
        },
        {
          title: 'Aimee AI Coach',
          href: '/aimee-ai/',
          swatch: '#E2E7F0',
          tags: ['AI Experience', 'Product Design'],
          impact: 'A conversational AI coach reaching 1M+ employees.'
        },
        {
          title: 'Smart Benefits Platform',
          href: '/work/smart-benefits/',
          swatch: '#E2EDE8',
          tags: ['Enterprise UX', 'Systems Design'],
          impact: 'Guided open enrollment with three white-label embed modes.'
        }
      ];

      const CHIP_LABELS = {
        casestudies: 'Case studies',
        about: 'About Bri',
        resume: 'Résumé',
        contact: 'Contact'
      };

      const arrowSvg =
        '<svg class="cs-card-arrow" width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

      function esc(s) {
        return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      function caseCardsHtml() {
        return '<div class="cs-cards">' + CASE_STUDIES.map(cs => `
          <a class="cs-card${cs.featured ? ' cs-card--featured' : ''}" href="${cs.href}">
            ${cs.featured ? '<span class="featured-pill">Featured</span>' : ''}
            <span class="cs-card-swatch" style="background:${cs.swatch}"></span>
            <span class="cs-card-body">
              <span class="cs-card-tags">${cs.tags.map(t => `<span class="mini-tag">${t}</span>`).join('')}</span>
              <span class="cs-card-title">${cs.title}</span>
              <span class="cs-card-impact">${cs.impact}</span>
            </span>
            ${arrowSvg}
          </a>`).join('') + '</div>';
      }

      // Intent responses: { text, block (html|null), chips: [intentIds] }
      const RESPONSES = {
        casestudies: () => ({
          text: "Here's Bri's selected work. I'd start with the featured one — Global Content Studio, an AI content studio she designed and built solo, end to end.",
          block: caseCardsHtml(),
          chips: ['about', 'resume', 'contact']
        }),
        about: () => ({
          text: "Bri May is a senior product designer and creative director — a decade in product, designing since 2011. She turns complex systems into simple, high-impact experiences, and has worked with companies like Meta, the NFL, and JPMorgan. Lately she designs and builds AI products end to end.",
          block: '<div class="link-row"><a class="link-btn link-btn--primary" href="/about/">Read the full story →</a></div>',
          chips: ['casestudies', 'resume', 'contact']
        }),
        resume: () => ({
          text: "The short version: senior product designer & creative director, ten years across product, brand, and AI-powered experiences. Want the full detail?",
          block: '<div class="link-row"><a class="link-btn link-btn--primary" href="/resume/">View résumé →</a><a class="link-btn link-btn--secondary" href="/about/">More about Bri</a></div>',
          chips: ['casestudies', 'about', 'contact']
        }),
        contact: () => ({
          text: "Bri's currently exploring senior product design roles. Here are the best ways to reach her:",
          block: '<div class="link-row"><a class="link-btn link-btn--primary" href="mailto:thebrimay@gmail.com">Email Bri</a><a class="link-btn link-btn--secondary" href="https://www.linkedin.com/in/brimay" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a><a class="link-btn link-btn--secondary" href="/contact/">Contact page →</a></div>',
          chips: ['casestudies', 'about', 'resume']
        }),
        greet: () => ({
          text: "Hey! Here's what I can help you explore:",
          block: null,
          chips: ['casestudies', 'about', 'resume', 'contact']
        }),
        fallback: () => ({
          text: "I'm not sure I caught that — but I can show you Bri's case studies, her background, her résumé, or how to get in touch. Pick one:",
          block: null,
          chips: ['casestudies', 'about', 'resume', 'contact']
        })
      };

      function matchIntent(q) {
        const s = q.toLowerCase();
        const has = arr => arr.some(k => s.includes(k));
        if (has(['resume', 'résumé', 'resumé', 'cv', 'curriculum'])) return 'resume';
        if (has(['contact', 'email', 'hire', 'reach', 'linkedin', 'touch', 'available', 'connect', 'message', 'get in'])) return 'contact';
        if (has(['case', 'work', 'project', 'portfolio', 'studies', 'study', 'global content', 'content studio', 'aimee', 'hub', 'benefits', 'featured'])) return 'casestudies';
        if (has(['about', 'who', 'bri', 'background', 'bio', 'story', 'experience', 'career'])) return 'about';
        if (has(['hi', 'hello', 'hey', 'yo', 'sup', 'howdy'])) return 'greet';
        return 'fallback';
      }

      // ── DOM builders ──
      function elFromHtml(html) {
        const t = document.createElement('template');
        t.innerHTML = html.trim();
        return t.content.firstElementChild;
      }

      function scrollToComposer() {
        input.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
      }

      function addUserMessage(text) {
        const msg = document.createElement('div');
        msg.className = 'msg msg--user';
        const bubble = document.createElement('div');
        bubble.className = 'bubble bubble--user';
        bubble.textContent = text; // textContent — safe against injection
        msg.appendChild(bubble);
        thread.appendChild(msg);
      }

      function buildChips(ids) {
        const wrap = document.createElement('div');
        wrap.className = 'chips';
        ids.forEach(id => {
          const btn = document.createElement('button');
          btn.className = 'chip';
          btn.type = 'button';
          btn.dataset.intent = id;
          btn.innerHTML = '<span class="plus">+</span>' + esc(CHIP_LABELS[id] || id);
          btn.addEventListener('click', () => handleIntent(id, CHIP_LABELS[id] || id));
          wrap.appendChild(btn);
        });
        return wrap;
      }

      function addAgentMessage(res) {
        const msg = elFromHtml(`
          <div class="msg msg--agent">
            <div class="avatar">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 2l1.7 6.1L20 10l-6.3 1.9L12 18l-1.7-6.1L4 10l6.3-1.9z"/></svg>
            </div>
            <div class="msg-content">
              <div class="msg-name">Portfolio Agent</div>
            </div>
          </div>`);
        const content = msg.querySelector('.msg-content');

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = res.text;
        content.appendChild(bubble);

        if (res.block) content.appendChild(elFromHtml(res.block));
        if (res.chips && res.chips.length) content.appendChild(buildChips(res.chips));

        thread.appendChild(msg);
      }

      function showTyping() {
        const msg = elFromHtml(`
          <div class="msg msg--agent" data-typing="1">
            <div class="avatar">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M12 2l1.7 6.1L20 10l-6.3 1.9L12 18l-1.7-6.1L4 10l6.3-1.9z"/></svg>
            </div>
            <div class="msg-content">
              <div class="typing" aria-label="Agent is typing"><span></span><span></span><span></span></div>
            </div>
          </div>`);
        thread.appendChild(msg);
        scrollToComposer();
        return msg;
      }

      let busy = false;
      function respond(intentId) {
        const res = (RESPONSES[intentId] || RESPONSES.fallback)();
        const typing = showTyping();
        busy = true;
        setTimeout(() => {
          typing.remove();
          addAgentMessage(res);
          busy = false;
          scrollToComposer();
          input.focus();
        }, TYPING_MS);
      }

      function handleIntent(intentId, userLabel) {
        if (busy) return;
        if (userLabel) addUserMessage(userLabel);
        respond(intentId);
      }

      // ── Free-text submit ──
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const q = input.value.trim();
        if (!q || busy) return;
        input.value = '';
        addUserMessage(q);
        respond(matchIntent(q));
      });

      // ── Initial greeting (rendered without a typing delay) ──
      addAgentMessage({
        text: "Hi — I'm Bri's portfolio agent. I can walk you through her case studies, give you the quick version of her background, or pull up her résumé and contact info. Where would you like to start?",
        block: null,
        chips: ['casestudies', 'about', 'resume', 'contact']
      });
    })();
  </script>

</body>
</html>
